server:
  port: 8081

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # 默认使用开发环境配置
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:heartsphere}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci&useInformationSchema=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Spring AI Alibaba DashScope配置（使用OpenAPI兼容模式）
  ai:
    dashscope:
      api-key: sk-a486b81e29484fcea112b2c010b7bd95
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: qwen-max
          temperature: 0.7
    # 豆包（字节跳动）配置
    doubao:
      api-key: 9ed07a4e-5dad-4cbc-8548-3295e7875b41
      base-url: https://ark.cn-beijing.volces.com/api/v3
  

  # Flyway配置（数据库迁移）
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true  # 生产环境禁用clean操作
  
  jpa:
    hibernate:
      ddl-auto: none  # 完全禁用 DDL 操作，由 JpaConfig 配置类统一管理
    show-sql: false  # 生产环境建议关闭
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect  # 使用MySQLDialect替代已弃用的MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        # Schema 验证相关配置由 JpaConfig 配置类统一管理
        use_jdbc_metadata_defaults: false
        temp.use_jdbc_metadata_defaults: false
        validator.apply_to_ddl: false
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
    throw-exception-if-no-handler-found: true  # 启用抛出 NoHandlerFoundException，以便在全局异常处理器中统一处理 404 错误（如 favicon.ico）
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      write-date-timestamps-as-nanoseconds: false
    mapper:
      accept-case-insensitive-enums: true
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # CORS 配置（由 WebSecurityConfig 统一管理）
  # 注意：CORS配置统一在 WebSecurityConfig 中管理，Controller层禁止使用@CrossOrigin注解

# JWT 配置
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production}
  expiration: 86400000 # 24小时
  refresh-expiration: 604800000 # 7天

# 微信登录配置（微信开放平台网站应用）
wechat:
  app-id: ${WECHAT_APP_ID:your-wechat-app-id}
  app-secret: ${WECHAT_APP_SECRET:your-wechat-app-secret}
  redirect-uri: ${WECHAT_REDIRECT_URI:http://localhost:8081/api/wechat/callback}

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    doc-expansion: none
    default-models-expand-depth: 1
    default-model-expand-depth: 1
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  show-actuator: false

# 应用配置
app:
  # CORS配置（由 WebSecurityConfig 统一管理）
  cors:
    # 生产环境允许的来源（逗号分隔）
    # 开发环境默认允许所有来源，无需配置
    # 示例：allowed-origins: https://yourdomain.com,https://www.yourdomain.com
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  
  # 图片存储配置
  image:
    storage:
      type: ${IMAGE_STORAGE_TYPE:local} # local, oss, s3
      local:
        path: ${IMAGE_STORAGE_PATH:../../uploads/images}
      base-url: ${IMAGE_BASE_URL:}  # 图片服务基础URL，如果未配置则自动使用当前请求的域名。格式：http://domain.com/api/images
      max-size: ${IMAGE_MAX_SIZE:10485760} # 10MB (单位：字节)
    processing:
      thumbnail:
        default-width: ${IMAGE_THUMBNAIL_DEFAULT_WIDTH:200} # 默认缩略图宽度
        default-height: ${IMAGE_THUMBNAIL_DEFAULT_HEIGHT:200} # 默认缩略图高度
        default-quality: ${IMAGE_THUMBNAIL_DEFAULT_QUALITY:0.7} # 默认压缩质量 (0.0-1.0)
        keep-aspect-ratio: ${IMAGE_THUMBNAIL_KEEP_ASPECT_RATIO:true} # 默认保持宽高比
      crop:
        max-width: ${IMAGE_CROP_MAX_WIDTH:5000} # 最大裁剪宽度
        max-height: ${IMAGE_CROP_MAX_HEIGHT:5000} # 最大裁剪高度
      variants:
        # 中等质量图配置（用于详情页、对话框等）
        medium:
          width: ${IMAGE_MEDIUM_WIDTH:800} # 中等质量图宽度
          height: ${IMAGE_MEDIUM_HEIGHT:600} # 中等质量图高度
          quality: ${IMAGE_MEDIUM_QUALITY:0.85} # 中等质量图压缩质量 (0.0-1.0)
        # 高质量背景图配置（用于PC ChatWindow背景）
        high-quality:
          width: ${IMAGE_HIGH_QUALITY_WIDTH:1920} # 高质量背景图宽度
          height: ${IMAGE_HIGH_QUALITY_HEIGHT:1080} # 高质量背景图高度
          quality: ${IMAGE_HIGH_QUALITY_QUALITY:0.9} # 高质量背景图压缩质量 (0.0-1.0)
        # 是否在上传时自动生成多分辨率版本
        auto-generate: ${IMAGE_AUTO_GENERATE_VARIANTS:true} # 是否自动生成多分辨率版本
        # 是否包含高质量背景图（PC ChatWindow专用）
        include-high-quality: ${IMAGE_INCLUDE_HIGH_QUALITY:false} # 是否生成高质量背景图（默认false，需要时通过参数指定）

  # 视频处理配置
  video:
    storage:
      type: ${VIDEO_STORAGE_TYPE:local} # local, oss, s3
      local:
        path: ${VIDEO_STORAGE_PATH:../../uploads/videos}
      base-url: ${VIDEO_BASE_URL:}  # 视频服务基础URL，如果未配置则自动使用当前请求的域名
      max-size: ${VIDEO_MAX_SIZE:104857600} # 100MB (单位：字节)
      supported-formats: ${VIDEO_SUPPORTED_FORMATS:mp4,mov,avi,webm} # 支持的视频输入格式
    processing:
      # FFmpeg 路径配置（优先级：环境变量 > 配置项 > 系统PATH > 本地tools/bin/ffmpeg）
      ffmpeg-path: ${FFMPEG_PATH:/Users/admin/Workspace/heartsphere_new/backend/tools/bin/ffmpeg} # 默认使用本地工具目录的 FFmpeg
      animation:
        default-fps: ${VIDEO_ANIMATION_DEFAULT_FPS:10} # 默认帧率
        max-fps: ${VIDEO_ANIMATION_MAX_FPS:30} # 最大帧率
        default-width: ${VIDEO_ANIMATION_DEFAULT_WIDTH:640} # 默认宽度
        default-height: ${VIDEO_ANIMATION_DEFAULT_HEIGHT:480} # 默认高度
        max-duration: ${VIDEO_ANIMATION_MAX_DURATION:30} # 最大时长（秒）
        default-quality: ${VIDEO_ANIMATION_DEFAULT_QUALITY:medium} # 默认质量 (low, medium, high)
        supported-formats: ${VIDEO_ANIMATION_SUPPORTED_FORMATS:gif,lottie,pag} # 支持的动画输出格式
        # GIF格式特定配置
        gif:
          palette-optimization: true # 调色板优化
        # Lottie格式特定配置
        lottie:
          precision: ${VIDEO_LOTTIE_PRECISION:3} # 精度（小数位数）
          optimize: ${VIDEO_LOTTIE_OPTIMIZE:true} # 优化输出
        # PAG格式特定配置
        pag:
          compression-level: ${VIDEO_PAG_COMPRESSION:6} # 压缩级别 (0-9)
          # PAGConvertor 工具路径（优先级：环境变量 > 配置项 > 系统PATH > 本地工具目录）
          convertor-path: ${PAG_CONVERTOR_PATH:/Users/admin/Workspace/heartsphere_new/backend/tools/bin/PAGConvertor} # 默认使用本地工具目录的 PAGConvertor

# 心域连接功能配置
heartconnect:
  portal:
    enabled: ${PORTAL_ENABLED:true}  # 传送门功能开关，默认开启
    features:
      stargate: true   # 星门传送门
      wormhole: true   # 虫洞传送门
      quantum: true    # 量子传送门

# 技能选择配置（纯 LLM 驱动，已移除规则驱动）
skill:
  selection:
    # LLM 驱动配置
    llm-driven:
      enabled: ${SKILL_LLM_DRIVEN_ENABLED:true}  # 是否启用 LLM 驱动（默认：true）
      level1-candidates: ${SKILL_LEVEL1_CANDIDATES:10}  # Level 1 筛选的候选数量
      level2-candidates: ${SKILL_LEVEL2_CANDIDATES:5}  # Level 2 评估的候选数量
      level3-candidates: ${SKILL_LEVEL3_CANDIDATES:3}  # Level 3 最终决策的候选数量
      enable-level3: ${SKILL_ENABLE_LEVEL3:true}  # 是否启用 Level 3（默认：true）
      model: ${SKILL_LLM_MODEL:gpt-4}  # LLM 模型
      temperature: ${SKILL_LLM_TEMPERATURE:0.3}  # 温度参数
      max-tokens: ${SKILL_LLM_MAX_TOKENS:1000}  # 最大 Token 数
    # 缓存配置
    cache:
      level1-ttl: ${SKILL_CACHE_LEVEL1_TTL:3600}  # Level 1 缓存 TTL（秒）
      level2-ttl: ${SKILL_CACHE_LEVEL2_TTL:1800}  # Level 2 缓存 TTL（秒）
      level3-ttl: ${SKILL_CACHE_LEVEL3_TTL:600}  # Level 3 缓存 TTL（秒）
      llm-result-ttl: ${SKILL_CACHE_LLM_RESULT_TTL:300}  # LLM 结果缓存 TTL（秒）

# 记忆系统配置
heartsphere:
  memory:
    short-memory:
      message-ttl: 604800  # 7天（秒）
      max-messages-per-session: 100
      working-memory-ttl: 86400  # 24小时（秒）
    long-memory:
      extraction-importance-threshold: 0.7
      extraction-confidence-threshold: 0.6
    extraction:
      enable-llm-extraction: true
      enable-rule-extraction: true
      batch-size: 10
    # HSMem 服务配置
    hsmem:
      mode: ${HSMEM_MODE:local}   # local=Main内置实现（默认），remote=外部HSMem服务
      local:
        base-path: ${HSMEM_LOCAL_BASE_PATH:./memory_data}
      base-url: ${HSMEM_BASE_URL:http://localhost:8000}  # HSMem 服务地址，mode=remote 时使用
      timeout: 30  # 请求超时时间（秒）
      retry:
        enabled: true  # 是否启用重试
        max-attempts: 3  # 最大重试次数
        backoff: 1  # 重试退避时间（秒）
      slow-request-threshold-ms: 1000  # 慢请求阈值（毫秒），超过此值的请求记录 WARN 级别日志


# 日志配置
logging:
  level:
    # 根日志级别
    root: INFO
    # 应用包日志级别
    com.heartsphere: INFO
    # 传送门相关日志
    com.heartsphere.heartconnect.portal: INFO
    # 枚举转换器日志
    com.heartsphere.heartconnect.portal.entity.converter: INFO
    # Hibernate SQL日志
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
    org.hibernate.type: INFO
    # Spring Data JPA日志
    org.springframework.data.jpa: INFO
    # 数据库连接池日志
    com.zaxxer.hikari: INFO
    # Spring Security日志
    org.springframework.security: INFO
    # 应用安全过滤器日志
    com.heartsphere.security: INFO
    # HTTP请求日志
    org.springframework.web: INFO
    # SQL语句和参数日志
    org.hibernate.engine.internal: INFO
    # AI服务日志
    com.heartsphere.aiagent: INFO
    # Spring AI日志
    org.springframework.ai: INFO
    com.alibaba.cloud.ai: INFO
    # Netty DNS日志（用于调试DNS问题）
    io.netty.resolver.dns: INFO
    # HSMem Client 服务日志
    com.heartsphere.memory.service.HSMemClientService: INFO
    # Memory Controller 日志
    com.heartsphere.memory.controller.MemoryController: INFO
    # HSMem 模式启动日志（HSMemModeRunner）
    com.heartsphere.memory.config: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"


