# 开发环境配置
spring:
  main:
    lazy-initialization: true  # 开发环境启用懒加载，加速启动
  
  jpa:
    show-sql: false  # 开发环境显示SQL
    properties:
      hibernate:
        format_sql: true

# SpringDoc OpenAPI 配置（开发环境启用）
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# 日志配置（开发环境详细日志）
logging:
  level:
    root: INFO
    com.heartsphere: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

  enabled: true

# 支付配置（开发环境默认关闭）
payment:
  enabled: false

# 应用配置（开发环境默认值）
app:
  # 图片存储配置（开发环境默认值）
  image:
    storage:
      # 开发环境默认图片服务基础URL（生产环境使用环境变量 IMAGE_BASE_URL）
      base-url: ${IMAGE_BASE_URL:http://localhost:8081/api/images}
  
  # 管理后台URL配置（开发环境默认值，生产环境使用环境变量 ADMIN_URL）
  admin:
    base-url: ${ADMIN_URL:http://localhost:8085}
