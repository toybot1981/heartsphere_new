server:
  port: 8085
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: heartsphere-admin-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:52428800}  # 50MB (默认值，与 app.image.storage.max-size 保持一致)
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:52428800}  # 50MB
      enabled: true
  # 多数据源配置
  datasource:
    # Admin主数据源（默认数据源）
    admin:
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:heartsphere}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci
      username: ${DB_USER:root}
      password: ${DB_PASSWORD:123456}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        pool-name: AdminHikariPool
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
    # Mentis数据源（使用独立的heartsphere_mentis数据库）
    mentis:
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MENTIS_DB_NAME:heartsphere_mentis}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci
      username: ${DB_USER:root}
      password: ${DB_PASSWORD:123456}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        pool-name: MentisHikariPool
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
    # Edu数据源
    edu:
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${EDU_DB_NAME:heartsphere_edu}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci
      username: ${DB_USER:root}
      password: ${DB_PASSWORD:123456}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        pool-name: EduHikariPool
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
    # Agent Mind数据源（使用独立的heartsphere_agent_mind数据库）
    agent-mind:
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${AGENT_MIND_DB_NAME:heartsphere_agent_mind}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci
      username: ${DB_USER:root}
      password: ${DB_PASSWORD:123456}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        pool-name: AgentMindHikariPool
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
    # 注意：
    # - main项目直接使用heartsphere数据库（admin数据源），不需要单独配置
    # - company项目直接使用heartsphere数据库（admin数据源），不需要单独配置
    # 禁用 H2 数据库控制台（如果存在）
    h2:
      console:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true

# JWT 配置
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production}
  expiration: ${JWT_EXPIRATION:86400000}  # 24小时

# 教育版后端配置
edu:
  backend:
    base-url: ${EDU_BACKEND_BASE_URL:http://localhost:8084}
    timeout:
      connect: 5000      # 连接超时（毫秒）
      read: 30000        # 读取超时（毫秒）
    retry:
      max-attempts: 3    # 最大重试次数
      backoff-delay: 1000  # 重试延迟（毫秒）

# Mentis 后端配置
mentis:
  backend:
    base-url: ${MENTIS_BACKEND_BASE_URL:http://localhost:8082}

# Agent Mind 后端配置
agent-mind:
  backend:
    base-url: ${AGENT_MIND_BACKEND_BASE_URL:http://localhost:8086}

# Main 后端配置
main:
  backend:
    base-url: ${MAIN_BACKEND_BASE_URL:http://localhost:8081}

# 应用配置
app:
  # 图片存储配置
  image:
    storage:
      base-url: ${IMAGE_BASE_URL:http://localhost:8081/images}
      local:
        path: ${IMAGE_STORAGE_PATH:../../uploads/images}
      max-size: ${IMAGE_MAX_SIZE:52428800}  # 50MB
    processing:
      variants:
        auto-generate: ${IMAGE_AUTO_GENERATE_VARIANTS:true}
        include-high-quality: ${IMAGE_INCLUDE_HIGH_QUALITY:false}
  # 视频存储配置
  video:
    storage:
      local:
        path: ${VIDEO_STORAGE_PATH:../../uploads/videos}
      max-size: ${VIDEO_MAX_SIZE:104857600}  # 100MB
      supported-formats: ${VIDEO_SUPPORTED_FORMATS:mp4,mov,avi,webm}
    # 视频转换工具路径配置（可选，如果未配置则使用默认相对路径）
    # 默认路径相对于项目根目录（heartsphere_new/）
    tools:
      ffmpeg:
        path: ${FFMPEG_PATH:admin/backend/tools/bin/ffmpeg}  # 相对于项目根目录的路径，或绝对路径（例如: /usr/local/bin/ffmpeg）
      pag:
        path: ${PAG_CONVERTOR_PATH:admin/backend/tools/bin/PAGConvertor}  # 相对于项目根目录的路径，或绝对路径（例如: /usr/local/bin/PAGConvertor）

# 日志配置
logging:
  level:
    root: INFO
    com.heartsphere.admin: INFO
    com.heartsphere.admin.service.edu: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
