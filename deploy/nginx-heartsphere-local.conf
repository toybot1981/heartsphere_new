# HeartSphere Nginx配置文件 - 本地开发环境
# 文件目录: /Users/admin/Workspace/heartsphere_new
# 
# 使用说明：
# 1. 将此文件复制到 /usr/local/etc/nginx/servers/heartsphere.conf (macOS)
#    或 /etc/nginx/sites-available/heartsphere (Linux)
# 2. 执行 sudo nginx -t 验证配置
# 3. 执行 sudo nginx -s reload 或 sudo systemctl reload nginx 重载配置
#
# 多项目路径路由说明：
# - main (PC): http://localhost:8080/ → main/frontend/dist/index.html
# - main (Mobile): http://localhost:8080/mobile.html → main/frontend/dist/mobile.html
# - admin: http://localhost:8080/admin.html → admin/frontend/dist/index.html
# - edu: http://localhost:8080/edu.html → edu/frontend/dist/index.html
# - mentis: http://localhost:8080/mentis → mentis/frontend/dist/index.html

# 移动端设备检测 map（在 server 块之前）
map $http_user_agent $is_mobile {
    default 0;
    ~*(android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile|tablet) 1;
}

server {
    listen       8080;
    server_name  localhost;

    # 字符集
    charset utf-8;

    # 访问日志
    access_log  /usr/local/var/log/nginx/heartsphere_access.log;
    error_log   /usr/local/var/log/nginx/heartsphere_error.log;

    # 文件上传大小限制
    client_max_body_size 50M;

    # 图片文件服务（必须在静态资源缓存之前）
    # 使用精确前缀匹配，确保优先于其他location
    # images 是 general 的上层目录，所有图片都通过 /images/ 路径访问
    location ^~ /images/ {
        alias /Users/admin/Workspace/heartsphere_new/main/backend/uploads/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        client_max_body_size 50M;
        
        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # API 代理 - Main 项目后端 (8081)
    location ^~ /api/main/ {
        # 移除 /api/main 前缀，转发到后端 /api/
        rewrite ^/api/main/(.*)$ /api/$1 break;
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 禁用缓冲，确保请求立即转发
        proxy_buffering off;
    }

    # API 代理 - Admin 项目后端 (8085)
    location ^~ /api/admin/ {
        # 移除 /api/admin 前缀，转发到后端 /api/
        rewrite ^/api/admin/(.*)$ /api/$1 break;
        proxy_pass http://localhost:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # API 代理 - Edu 项目后端 (8084)
    location ^~ /api/edu/ {
        # 移除 /api/edu 前缀，转发到后端 /api/
        rewrite ^/api/edu/(.*)$ /api/$1 break;
        proxy_pass http://localhost:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # API 代理 - Mentis 项目后端 (8082)
    location ^~ /api/mentis/ {
        # 移除 /api/mentis 前缀，转发到后端 /api/
        rewrite ^/api/mentis/(.*)$ /api/$1 break;
        proxy_pass http://localhost:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # 兼容旧版 API 路径（转发到 main 后端）
    location /api/ {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Admin 项目路径（必须在 location / 之前，使用精确匹配）
    location = /admin.html {
        root /Users/admin/Workspace/heartsphere_new/admin/frontend;
        try_files /dist/index.html =404;
    }

    # Edu 项目路径（必须在 location / 之前，使用精确匹配）
    location = /edu.html {
        root /Users/admin/Workspace/heartsphere_new/edu/frontend;
        try_files /dist/index.html =404;
    }

    # Mentis 项目路径（必须在 location / 之前）
    location ^~ /mentis {
        root /Users/admin/Workspace/heartsphere_new/mentis/frontend;
        try_files $uri $uri/ /dist/index.html;
    }

    # Main 项目移动端路径（必须在 location / 之前，使用精确匹配）
    location = /mobile.html {
        root /Users/admin/Workspace/heartsphere_new/main/frontend;
        try_files /dist/mobile.html =404;
    }

    # 静态资源缓存配置（排除 /images/ 路径）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # 排除 /images/ 路径，因为它有单独的配置
        if ($uri ~ ^/images/) {
            break;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Main 项目主路径配置（必须在最后，作为兜底）
    location / {
        root /Users/admin/Workspace/heartsphere_new/main/frontend;
        
        # 移动端检测：如果是移动设备且访问根路径，重定向到 /mobile.html
        if ($is_mobile = 1) {
            # 只对根路径和index.html进行重定向
            if ($uri = /) {
                return 302 /mobile.html;
            }
            if ($uri = /index.html) {
                return 302 /mobile.html;
            }
        }
        
        try_files $uri $uri/ /dist/index.html;
        
        # 缓存配置
        expires 1h;
        add_header Cache-Control "public";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 错误页面
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/local/var/www;
    }
}
