# HeartSphere Nginx配置文件 - 生产环境
# 文件目录: /opt/heartsphere
# 
# 使用说明：
# 1. 将此文件复制到 /etc/nginx/conf.d/heartsphere.conf (推荐)
#    或 /etc/nginx/sites-available/heartsphere (Ubuntu/Debian)
# 2. 修改 server_name 为实际域名（如：heartsphere.cn）
# 3. 执行 sudo nginx -t 验证配置
# 4. 执行 sudo systemctl reload nginx 重载配置

# 移动端设备检测 map（在 server 块之前）
map $http_user_agent $is_mobile {
    default 0;
    ~*(android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile|tablet) 1;
}

server {
    listen 80;
    # 修改为实际域名
    server_name heartsphere.cn www.heartsphere.cn _;

    # 根目录设置为生产环境前端部署路径
    # 生产环境前端地址：/opt/heartsphere/frontend
    root /opt/heartsphere/frontend;
    index index.html index.htm;

    # 日志配置
    access_log /var/log/nginx/heartsphere-access.log;
    error_log /var/log/nginx/heartsphere-error.log;

    # 文件上传大小限制
    client_max_body_size 50M;

    # 图片文件服务（必须在静态资源缓存之前）
    # 使用精确前缀匹配，确保优先于其他location
    # 图片文件服务
    # images 是 general 的上层目录，所有图片都通过 /images/ 路径访问
    location ^~ /images/ {
        alias /opt/heartsphere/backend/uploads/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        client_max_body_size 50M;
        
        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # 后端API代理
    location /api/ {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 禁用缓冲，确保请求立即转发
        proxy_buffering off;
        
        # 确保传递所有 CORS 响应头（不覆盖后端的 CORS 配置）
        # 注意：不要在此处使用 add_header，否则会覆盖后端的 CORS 响应头
        # 让后端的 CORS 配置完全控制响应头
    }

    # 静态资源缓存配置（排除 /images/ 路径）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # 排除 /images/ 路径，因为它有单独的配置
        if ($uri ~ ^/images/) {
            break;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 管理后台路径（必须在 location / 之前，使用精确匹配）
    location = /admin.html {
        try_files /admin.html =404;
    }

    # 移动端路径（必须在 location / 之前，使用精确匹配）
    location = /mobile.html {
        try_files /mobile.html =404;
    }

    # 前端静态文件（兜底配置，必须在最后）
    location / {
        # 移动端检测：如果是移动设备且访问根路径，重定向到 /mobile.html
        if ($is_mobile = 1) {
            # 只对根路径和index.html进行重定向
            if ($uri = /) {
                return 302 /mobile.html;
            }
            if ($uri = /index.html) {
                return 302 /mobile.html;
            }
        }
        
        try_files $uri $uri/ /index.html;
        
        # 缓存配置
        expires 1h;
        add_header Cache-Control "public";
        
        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # 健康检查端点（可选）
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

