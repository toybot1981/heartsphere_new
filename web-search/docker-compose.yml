version: '3.8'

services:
  web-search:
    build: ./backend
    container_name: heartsphere-web-search
    ports:
      - "8086:8086"
    environment:
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVER_PORT=8086
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - web-search-network

  redis:
    image: redis:7-alpine
    container_name: heartsphere-web-search-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - web-search-network

volumes:
  redis-data:
    driver: local

networks:
  web-search-network:
    driver: bridge
