# HSMem Configuration File

memory_store:
  base_path: "./memory_data"
  auto_save: true
  backup_enabled: true

extraction:
  default_method: "rule_based"  # Options: rule_based, llm_based
  llm_model: "gpt-3.5-turbo"
  max_items_per_resource: 50

retrieval:
  default_method: "simple"  # Options: simple, rag, llm
  max_results: 10
  similarity_threshold: 0.5

categories:
  auto_create: true
  merge_threshold: 0.7

logging:
  level: "INFO"
  file: "hsmem.log"
